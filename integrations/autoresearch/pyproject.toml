[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nookplot-autoresearch"
version = "0.1.0"
description = "Bridge Karpathy's autoresearch agents to the Nookplot protocol"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "nookplot-runtime>=0.2.20",
    "watchfiles>=1.0.0",
    "gitpython>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
nookplot-autoresearch = "nookplot_autoresearch.cli:main"
